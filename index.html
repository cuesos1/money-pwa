<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eef2fa">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Локальный калькулятор распределения денег. Работает офлайн.">
  <title>Распределение денег</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <script src="./calculator.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <main>
    <header><div><p class="eyebrow">ПРОСТО И ПО ПЛАНУ</p><h1>Распределение<br>денег</h1></div><button id="settings-toggle" class="glass icon-button" aria-label="Настройки процентов" aria-expanded="false" aria-controls="settings">⚙</button></header>
    <section class="glass income" aria-labelledby="income-label">
      <label id="income-label" for="income">Сколько получил?</label>
      <div class="amount-input"><input id="income" type="text" inputmode="decimal" placeholder="0" autocomplete="off" maxlength="20" aria-describedby="income-error"><span>₽</span></div>
      <p id="income-error" class="error" role="alert"></p>
      <p class="hint">Введи сумму — всё уже посчитано.</p>
    </section>
    <section id="results" class="cards" aria-label="Распределение суммы" aria-live="polite" aria-atomic="true"></section>
    <section id="settings" class="glass settings" hidden aria-labelledby="settings-title">
      <h2 id="settings-title">Твои проценты</h2>
      <p class="hint">В сумме должно быть ровно 100%.</p>
      <form id="settings-form" novalidate>
        <div id="percentage-fields"></div>
        <p id="settings-status" role="status"></p>
        <div class="actions"><button type="submit" class="primary">Сохранить</button><button id="reset" type="button" class="secondary">Сбросить</button></div>
      </form>
    </section>
    <footer><p id="offline-status">Все данные остаются на этом устройстве.</p><button id="install" class="secondary" hidden>Установить приложение</button><p id="install-help" class="hint">На iPhone: Safari → Поделиться → На экран «Домой». На Android: меню браузера → Установить приложение.</p></footer>
    <noscript>Для расчёта включи JavaScript в браузере.</noscript>
  </main>
</body>
</html>
